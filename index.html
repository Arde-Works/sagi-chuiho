<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 公開準備が整うまでは検索エンジンに載せない -->
<meta name="robots" content="noindex, nofollow">
<title>詐欺メール注意報（準備中）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{--bg:#F4F5F2;--surface:#FFFFFF;--ink:#16202B;--muted:#5F6B76;--line:#DDE1DC;--hdr:#1F3A5C;--red:#B3261E;--red-soft:#FBE9E7;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#10151B;--surface:#18202A;--ink:#E6EAEE;--muted:#93A0AC;--line:#2A3440;--hdr:#152536;--red:#F28B82;--red-soft:#3A1F1D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--hdr);color:#fff}
header .wrap{padding-block:20px}
h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.flag{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#F0B354;color:#1F3A5C;font-size:17px}
main{padding-block:24px 48px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.box p{margin:0}
.urgent{background:var(--red-soft);border-color:var(--red)}
.urgent b{color:var(--red)}
.tel{font-weight:700;font-size:17px}
footer{color:var(--muted);font-size:12px;padding-block:0 32px}
</style>
</head>
<body>
<header><div class="wrap"><h1><span class="flag" aria-hidden="true">!</span>詐欺メール注意報</h1></div></header>
<main class="wrap">
  <div class="box"><p>ただいま公開の準備をしています。公的機関と企業の公式発表から、いま出回っている詐欺メールやSMSを毎日まとめるサイトになる予定です。</p></div>
  <div class="box urgent">
    <p><b>詐欺かもしれないメッセージに、もう入力してしまった方へ</b></p>
    <p>入力したサービスのパスワードを公式アプリか公式サイトから変更し、カード番号を入れた場合はカード裏面の番号からカード会社に連絡してください。相談先：警察相談専用電話 <span class="tel">#9110</span>、消費者ホットライン <span class="tel">188</span></p>
  </div>
</main>
<footer class="wrap">運営：Arde Works</footer>
</body>
</html>
